)*10;let tx=THREE.MathUtils.clamp(player.position.x,homeX-4,homeX+4),tz=THREE.MathUtils.clamp(player.position.z,homeZ-4,homeZ+4);d.position.x+=(tx-d.position.x)*dt*.8;d.position.z+=(tz-d.position.z)*dt*.5;d.rotation.y=Math.sin(clock+i)*.12;d.userData.limbs.forEach((limb,j)=>limb.rotation.x=Math.sin(clock*5+i+j*Math.PI)*.17)});teammates.forEach((a,i)=>{a.position.z=7-i*6+Math.sin(clock*.8+i)*2;a.position.x=(i-1)*10+Math.sin(clock*.5+i)*2;a.userData.limbs.forEach((limb,j)=>limb.rotation.x=Math.sin(clock*6+i+j*Math.PI)*.22)});keeper.position.x=Math.sin(clock*1.8)*2.7;keeper.userData.limbs.forEach((a,i)=>a.rotation.x=Math.sin(clock*3+i)*.13);$('time').textContent=Math.ceil(time)}if(flash>0){flash-=dt;if(flash<=0)$('banner').style.opacity=0}let target=new THREE.Vector3(player.position.x*.32,1.1,player.position.z-14);camera.position.lerp(new THREE.Vector3(player.position.x*.35+12,17,player.position.z+19),Math.min(1,dt*2.2));camera.lookAt(target);renderer.render(scene,camera)}
