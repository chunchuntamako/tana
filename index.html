<script type="module">

function geomBox(w,h,d,color,rough=.7){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:rough}));m.castShadow=true;m.receiveShadow=true;return m}

function makePerson(blue){const g=new THREE.Group(),skin=0xc58c69,kit=blue?0x1658d4:0xf5b92e;function ell(w,h,d,color,x,y,z,parent=g){let m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),new THREE.MeshStandardMaterial({color,roughness:.72}));m.scale.set(w,h,d);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}function tube(a,b,r1,r2,color,parent=g){let d=new THREE.Vector3().subVectors(new THREE.Vector3(...b),new THREE.Vector3(...a));let m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,d.length(),12),new THREE.MeshStandardMaterial({color,roughness:.8}));m.position.copy(new THREE.Vector3(...a).add(new THREE.Vector3(...b)).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;parent.add(m);return m}ell(.45,.57,.26,kit,0,1.74,0);ell(.41,.23,.27,blue?0xfafafa:0x192c41,0,1.18,0);tube([0,2.18,0],[0,2.39,0],.14,.14,skin);ell(.29,.36,.27,skin,0,2.62,0);ell(.30,.15,.28,0x181a21,0,2.87,.01);ell(.09,.09,.055,skin,-.29,2.61,0);ell(.09,.09,.055,skin,.29,2.61,0);for(let x of [-.13,.13]){ell(.027,.029,.018,0x171c25,x,2.64,-.262);ell(.055,.026,.025,0x24262d,x,2.73,-.247)}if(blue){for(let x of [-.145,.145]){let lens=ell(.14,.092,.028,0x161b27,x,2.65,-.29);lens.material.transparent=true;lens.material.opacity=.87}tube([-.02,2.65,-.31],[.02,2.65,-.31],.023,.023,0x141821)}ell(.09,.04,.025,0x6c4436,0,2.48,-.267);let limbs=[];for(let x of [-1,1]){let leg=new THREE.Group();leg.position.set(x*.235,1.16,0);tube([0,0,0],[0,-.41,0],.16,.125,skin,leg);tube([0,-.36,0],[0,-.83,0],.13,.10,blue?0xffffff:0x172f48,leg);ell(.16,.115,.29,0x121820,0,-.86,-.13,leg);g.add(leg);limbs.push(leg);let arm=new THREE.Group();arm.position.set(x*.43,2.05,0);tube([0,0,0],[x*.07,-.36,0],.15,.115,kit,arm);tube([x*.07,-.36,0],[x*.09,-.68,0],.115,.085,skin,arm);ell(.105,.12,.09,skin,x*.09,-.72,0,arm);g.add(arm);limbs.push(arm)}let cvs=document.createElement('canvas');cvs.width=128;cvs.height=128;let cx=cvs.getContext('2d');cx.fillStyle='#ffffff';cx. function build(){scene=new THREE.Scene();scene.background=new THREE.Color(0x77a9c6);scene.fog=new THREE.Fog(0x7da5b5,140,260);camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,350);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe0f5ff,0x204225,2.4));let sun=new THREE.DirectionalLight(0xfff4d6,3.1);sun.position.set(-25,48,35);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(180,230),new THREE.MeshStandardMaterial({color:0x215f32,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let z=-60;z<60;z+=8){let stripe=new THREE.Mesh(new THREE.PlaneGeometry(56,8),new THREE.MeshStandardMaterial({color:(Math.round(z/8)%2)?0x2b8a42:0x318e46,roughness:1}));stripe.rotation.x=-Math.PI/2;stripe.position.set(0,.009,z+4);stripe.receiveShadow=true;scene.add(stripe)}
for(let x of [-28,28])fieldMark(x,-56,x,56);for(let z of [-56,56])fieldMark(-28,z,28,z);fieldMark(-28,0,28,0);fieldMark(-14,-56,-14,-38);fieldMark(14,-56,14,-38);fieldMark(-14,-38,14,-38);fieldMark(-6,-56,-6,-50);fieldMark(6,-56,6,-50);fieldMark(-6,-50,6,-50);
let circle=[];for(let i=0;i<=64;i++){let a=i*Math.PI*2/64;circle.push([9.15*Math.cos(a),9.15*Math.sin(a)])}line(circle);
const stadium=new THREE.Group();scene.add(stadium);for(let side of [-1,1]){for(let tier=0;tier<8;tier++){let stand=geomBox(4,1.5,160, [0x26394a,0x34495a,0x4b6374][tier%3]);stand.position.set(side*(35+tier*4),tier*1.5+1.5,0);stadium.add(stand)}for(let z=-70;z<=70;z+=3.5){let c=geomBox(.65,.65,.65,[0xe1c7a5,0x4a82ae,0xeeeeee,0xd54b48,0x23425b][Math.floor(Math.random()*5)]);c.position.set(side*(36+Math.random()*22),3+Math.random()*10,z);stadium.add(c)}}for(let end of [-1,1]){for(let tier=0;tier<5;tier++){let s=geomBox(80,1.5,4,0x30495c);s.position.set(0,tier*1.7+1.5,end*(66+tier*4));stadium.add(s)}}for(let x of [-38,38])for(let z of [-60,60]){let pole=cylinder(.35,.5,30,0x9eb7c2);pole.position.set(x,15,z);scene.add(pole);let light=geomBox(8,2,2,0xe8f6ff);light.position.set(x,30,z);scene.add(light)}for(let x of [-27,27]){let board=geomBox(.35,1.3,100,0x0b273a);board.position.set(x, .7,0);scene.add(board)}
// goal frame and net
let white=new THREE.MeshStandardMaterial({color:0xf8ffff,metalness:.15,roughness:.35});function bar(a,b,r=.12){let p1=new THREE.Vector3(...a),p2=new THREE.Vector3(...b),d=p2.clone().sub(p1);let mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),10),white);mesh.position.copy(p1).add(p2).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());mesh.castShadow=true;scene.add(mesh)}bar([-6,0,-55],[-6,3,-55]);bar([6,0,-55],[6,3,-55]);bar([-6,3,-55],[6,3,-55]);bar([-6,3,-55],[-6,3,-59]);bar([6,3,-55],[6,3,-59]);bar([-6,0,-59],[-6,3,-59]);bar([6,0,-59],[6,3,-59]);for(let x=-6;x<=6.01;x+=.6){let pts=[new THREE.Vector3(x,0,-59),new THREE.Vector3(x,3,-59),new THREE.Vector3(x,3,-55)];let net=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xe3efff,transparent:true,opacity:.4}));scene.add(net)}for(let y=0;y<=3.01;y+=.6){let pts=[new THREE.Vector3(-6,y,-59),new THREE.Vector3(6,y,-59)];scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xe3efff,transparent:true,opacity:.4})))}player=makePerson(true);player.position.set(0,0,19);scene.add(player);keeper=makePerson(false);keeper.position.set(0,0,-53.4);scene.add(keeper);for(let i=0;i<4;i++){let d=makePerson(false);d.scale.setScalar(.94);d.position.set((i-1.5)*6,0,-25-(i%2)*10);scene.add(d);defenders.push(d)}for(let i=0;i<3;i++){let a=makePerson(true);a.scale.setScalar(.94);a.position.set((i-1)*10,0,7-i*6);scene.add(a);teammates.push(a)}ball=new THREE.Mesh(new THREE.SphereGeometry(.37,20,16),new THREE.MeshStandardMaterial({color:0xf8fafc,roughness:.45}));ball.castShadow=true;scene.add(ball);for(let i=0;i<10;i++){let patch=new THREE.Mesh(new THREE.SphereGeometry(.08,6,6),new THREE.MeshStandardMaterial({color:0x161e2a}));let a=i*2.399,r=Math.sqrt(1-(1-2*(i+.5)/10)**2);patch.position.set(Math.cos(a)*r*.36,(1-2*(i+.5)/10)*.36,Math.sin(a)*r*.36);ball.add(patch)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});reset()}
function reset(){defenders.forEach((d,i)=>d.position.set((i-1.5)*6,0,-25-(i%2)*10));player.position.set(0,0,19);ball.position.set(0,.37,17.5);shot=null;canShoot=true;charge=0;$('power').style.width='0%'}
function start(){if(!renderer)return;score=0;time=60;active=true;reset();$('score').textContent='0';$('time').textContent='60';$('menu').style.display='none';last=performance.now()}
$('start').addEventListener('click',start);
function fire(){if(!active||!canShoot)return;canShoot=false;let p=Math.max(.25,charge);shot={velocity:27+p*31,vy:3+p*5,side:moveX*5,spin:p};charge=0;$('power').style.width='0%'}
$('shoot').addEventListener('pointerdown',e=>{e.preventDefault();charging=true;$('shoot').setPointerCapture(e.pointerId)});function release(){if(charging){charging=false;fire()}}$('shoot').addEventListener('pointerup',release);$('shoot').addEventListener('pointercancel',release);$('shoot').addEventListener('lostpointercapture',release);
const joy=$('joy'),knob=$('knob');function setJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),scale=Math.min(1,38/Math.max(1,l));moveX=x*scale/38;moveY=y*scale/38;knob.style.transform='translate('+x*scale+'px,'+y*scale+'px)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)});function clearJoy(){moveX=moveY=0;knob.style.transform=''}joy.addEventListener('pointerup',clearJoy);joy.addEventListener('pointercancel',clearJoy);$('dash').addEventListener('pointerdown',e=>{dashing=true;$('dash').setPointerCapture(e.pointerId)});for(let t of ['pointerup','pointercancel','lostpointercapture'])$('dash').addEventListener(t,()=>dashing=false);

function animate(now){requestAnimationFrame(animate);if(!renderer)return;let dt=Math.min(.05,(now-last)/1000||0);last=now;clock+=dt;if(active){time-=dt;if(time<=0){active=false;time=0;$('menu').style.display='flex';$('start').textContent='PLAY AGAIN ⚽';status('RESULT: '+score+' GOALS');}let x=moveX+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),z=moveY+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);let l=Math.max(1,Math.hypot(x,z)),speed=dashing||keys.ShiftLeft?16:9;player.position.x=THREE.MathUtils.clamp(player.position.x+x/l*speed*dt,-24,24);player.position.z=THREE.MathUtils.clamp(player.position.z+z/l*speed*dt,-48,45);let running=Math.hypot(x,z)>.1;player.rotation.y=running?THREE.MathUtils.lerp(player.rotation.y,Math.atan2(-x/l,-z/l),.12):player.rotation.y;for(let i=0;i<player.userData.limbs.length;i++){let limb=player.userData.limbs[i];limb.rotation.x=running?Math.sin(clock*speed*1.3+i*Math.PI)*.48:Math.sin(clock*2+i)*.03}if(charging){charge=Math.min(1,charge+dt/1.3);$('power').style.width=Math.round(charge*100)+'%'}if(!shot){ball.position.lerp(new THREE.Vector3(player.position.x,.37,player.position.z-1.6),Math.min(1,dt*12));ball.rotation.x-=running?dt*speed:0}else{ball.position.z-=shot.velocity*dt;ball.position.y+=shot.vy*dt;shot.vy-=14*dt;ball.position.x+=shot.side*dt;ball.rotation.x-=dt*18;if(ball.position.y<.37){ball.position.y=.37;shot.vy=Math.abs(shot.vy)*.36;shot.velocity*=.87}if(ball.position.z<-55){if(Math.abs(ball.position.x)<5.6&&ball.position.y<3.3){score++;$('score').textContent=score;banner('GOOOAL!')}else banner('SO CLOSE!');reset()}}defenders.forEach((d,i)=>{let homeX=(i-1.5)*6,homeZ=-25-(i%2)*10;let tx=THREE.MathUtils.clamp(player.position.x,homeX-4,homeX+4),tz=THREE.MathUtils.clamp(player.position.z,homeZ-4,homeZ+4);d.position.x+=(tx-d.position.x)*dt*.8;d.position.z+=(tz-d.position.z)*dt*.5;d.rotation.y=Math.sin(clock+i)*.12;d.userData.limbs.forEach((limb,j)=>limb.rotation.x=Math.sin(clock*5+i+j*Math.PI)*.17)});teammates.forEach((a,i)=>{a.position.z=7-i*6+Math.sin(clock*.8+i)*2;a.position.x=(i-1)*10+Math.sin(clock*.5+i)*2;a.userData.limbs.forEach((limb,j)=>limb.rotation.x=Math.sin(clock*6+i+j*Math.PI)*.22)});keeper.position.x=Math.sin(clock*1.8)*2.7;keeper.userData.limbs.forEach((a,i)=>a.rotation.x=Math.sin(clock*3+i)*.13);$('time').textContent=Math.ceil(time)}if(flash>0){flash-=dt;if(flash<=0)$('banner').style.opacity=0}let target=new THREE.Vector3(player.position.x*.6,2,player.position.z-8);camera.position.lerp(new THREE.Vector3(player.position.x*.72,6.2,player.position.z+12),Math.min(1,dt*3));camera.lookAt(target);renderer.render(scene,camera)}
