<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TANABECKHAM 3D FOOTBALL</title><style>*{box-sizing:border-box}body{margin:0;background:#071927;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#menu{position:fixed;inset:0;background:#061b2bed;display:grid;place-items:center;text-align:center;z-index:5;padding:20px}button{border:0;border-radius:30px;background:#ffd35d;color:#142535;font-weight:900;font-size:22px;padding:17px 36px}#joy,#shoot{position:fixed;bottom:20px;border-radius:50%;z-index:3;touch-action:none;user-select:none}#joy{left:20px;width:110px;height:110px;background:#193d4caa;border:2px solid #bde5ee}#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#bde5ee}#shoot{right:22px;width:95px;height:95px;background:#d94c3f;color:white;display:grid;place-items:center;font-weight:bold;border:2px solid white}#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#071927dd;padding:9px;border-radius:8px;font-weight:bold;white-space:nowrap}#message{position:fixed;top:24%;width:100%;text-align:center;font-size:36px;color:#ffdb61;font-weight:900;text-shadow:2px 3px #17222c;pointer-events:none}</style><canvas id="field"></canvas><div id="hud">GOALS <span id="score">0</span> | <span id="time">60</span>s</div><div id="message"></div><div id="joy"><div id="knob"></div></div><div id="shoot">SHOOT</div><div id="menu"><div><h1>TANABECKHAM<br>3D FOOTBALL</h1><p>青い10番、ピッチへ。<br>左スティックで移動、右でシュート！</p><button id="start" type="button">KICK OFF ⚽</button><p style="font-size:12px">Phase 1 ブラウザ動作確認版</p></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d');let w,h,active=false,score=0,time=60,last=0,px=0,pz=22,bx=0,bz=19,ballFlying=false,joyX=0,joyY=0,shootVelocity=0,keys={};function resize(){w=canvas.width=innerWidth*devicePixelRatio;h=canvas.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();function reset(){px=0;pz=22;bx=0;bz=19;ballFlying=false;shootVelocity=0}function start(){active=true;score=0;time=60;reset();$('score').textContent='0';$('time').textContent='60';$('menu').style.display='none';last=performance.now()}$('start').onclick=start;function project(x,z){let d=Math.max(4,pz-z+13),s=h*1.15/d;return [w/2+(x-px)*s,h*.28+3.7*s,s]}function line(x,z,x2,z2){let a=project(x,z),b=project(x2,z2);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}function render(){let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#78b8dd');sky.addColorStop(.35,'#bad9df');sky.addColorStop(.36,'#2d7742');sky.addColorStop(1,'#164a31');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(let z=-45;z<55;z+=10){let a=project(-30,z),b=project(30,z),c=project(30,z+10),d=project(-30,z+10);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.lineTo(...c);ctx.lineTo(...d);ctx.fillStyle=(z/10)%2?'#2f8047':'#398d50';ctx.fill()}ctx.strokeStyle='#efffed';ctx.lineWidth=Math.max(1,w/600);ctx.beginPath();line(-22,-40,22,-40);line(-22,40,22,40);line(-22,-40,-22,40);line(22,-40,22,40);line(-22,0,22,0);line(-9,-40,-9,-28);line(9,-40,9,-28);line(-9,-28,9,-28);ctx.stroke();let goal=project(0,-40);ctx.strokeStyle='white';ctx.lineWidth=5;ctx.strokeRect(goal[0]-goal[2]*5,goal[1]-goal[2]*3,goal[2]*10,goal[2]*3);function person(x,z,color,num){let p=project(x,z),s=p[2];ctx.fillStyle='#1d2531';ctx.fillRect(p[0]-s*.35,p[1]-s*1.4,s*.3,s*1.4);ctx.fillRect(p[0]+s*.1,p[1]-s*1.4,s*.3,s*1.4);ctx.fillStyle=color;ctx.fillRect(p[0]-s*.6,p[1]-s*3,s*1.2,s*1.65);ctx.fillStyle='#f1c5a3';ctx.beginPath();ctx.arc(p[0],p[1]-s*3.5,s*.48,0,7);ctx.fill();ctx.fillStyle='#141414';ctx.fillRect(p[0]-s*.5,p[1]-s*3.95,s, s*.25);ctx.fillStyle='white';ctx.font=Math.max(8,s*.8)+'px system-ui';ctx.textAlign='center';ctx.fillText(num,p[0],p[1]-s*1.85)}person(0,-38,'#d4a22b','GK');person(px,pz,'#1452b6','10');let p=project(bx,bz);ctx.fillStyle='white';ctx.beginPath();ctx.arc(p[0],p[1]-p[2]*.35,Math.max(3,p[2]*.32),0,7);ctx.fill()}function tick(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(active){time-=dt;if(time<=0){active=false;$('menu').style.display='grid';$('start').textContent='RETRY ⚽';$('menu').querySelector('p').textContent='終了！ '+score+' GOALS';time=0}let dx=joyX+(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dz=joyY+(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0),mag=Math.max(1,Math.hypot(dx,dz));px=Math.max(-20,Math.min(20,px+dx/mag*dt*9));pz=Math.max(-35,Math.min(37,pz+dz/mag*dt*9));if(!ballFlying){bx=px;bz=pz-2}else{bz-=shootVelocity*dt;bx*=.999;if(bz<-40){if(Math.abs(bx)<5){score++;$('score').textContent=score;$('message').textContent='GOOOAL!'}else $('message').textContent='MISS!';reset();setTimeout(()=>$('message').textContent='',1000)}}$('time').textContent=Math.ceil(time)}render();requestAnimationFrame(tick)}requestAnimationFrame(tick);function shoot(){if(!active||ballFlying)return;ballFlying=true;shootVelocity=37}const j=$('joy'),k=$('knob');function move(e){let r=j.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.max(1,Math.hypot(x,y)),f=Math.min(1,37/m);joyX=x*f/37;joyY=y*f/37;k.style.transform='translate('+x*f+'px,'+y*f+'px)'}j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);move(e)};j.onpointermove=e=>{if(j.hasPointerCapture(e.pointerId))move(e)};j.onpointerup=j.onpointercancel=()=>{joyX=joyY=0;k.style.transform=''};$('shoot').onpointerdown=e=>{e.preventDefault();shoot()};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')shoot()});addEventListener('keyup',e=>keys[e.code]=false)})();</script></html>
